<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Member Login | Bear Link</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script id="tailwind-config">
tailwind.config = {
    theme: {
        extend: {
            colors: {
                "surface":"#f7fafd","surface-container-low":"#f1f4f7","surface-container":"#ebeef1",
                "surface-container-lowest":"#ffffff","surface-container-high":"#e5e8eb",
                "surface-container-highest":"#e0e3e6","on-surface":"#181c1e","on-surface-variant":"#444651",
                "primary":"#001a48","primary-container":"#002d72","on-primary":"#ffffff","on-primary-container":"#7a97e2",
                "secondary":"#a04100","on-secondary":"#ffffff","outline-variant":"#c4c6d2","outline":"#747782",
                "error":"#ba1a1a","error-container":"#ffdad6"
            },
            fontFamily: { "headline":["Manrope"],"body":["Inter"] }
        }
    }
}
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.hero-gradient { background: linear-gradient(135deg, #001a48 0%, #002d72 100%); }
</style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center">

<div class="w-full max-w-md mx-auto px-6">
    <!-- Logo / brand -->
    <div class="text-center mb-10">
        <a href="index.html" class="inline-flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl hero-gradient flex items-center justify-center shadow-lg">
                <span class="material-symbols-outlined text-white text-xl">link</span>
            </div>
            <span class="text-2xl font-extrabold tracking-tighter text-primary font-headline">Bear Link</span>
        </a>
        <p class="text-on-surface-variant text-sm mt-3">Bridgeland FBLA members &amp; officers</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-container-lowest rounded-xl p-5 sm:p-8 shadow-[0px_12px_32px_rgba(24,28,30,0.06)]">

        <!-- Tabs -->
        <div class="flex gap-1 p-1 bg-surface-container-low rounded-lg mb-8">
            <button type="button" id="tab-code"
                class="flex-1 py-2.5 rounded-md text-sm font-bold bg-surface-container-lowest text-primary shadow-sm transition-all">
                Member code
            </button>
            <button type="button" id="tab-admin"
                class="flex-1 py-2.5 rounded-md text-sm font-bold text-on-surface-variant hover:text-primary transition-all">
                Admin
            </button>
        </div>

        <h1 id="cardTitle" class="text-2xl font-extrabold font-headline text-primary mb-2">Enter the member code</h1>
        <p id="cardBlurb" class="text-on-surface-variant text-sm mb-8">Get the code from an officer. No account or email needed.</p>

        <!-- Banner -->
        <div id="errorBanner" class="hidden mb-6 p-4 bg-error-container rounded-lg flex items-start gap-3">
            <span class="material-symbols-outlined text-error text-sm mt-0.5">error</span>
            <p id="errorMsg" class="text-sm text-error font-medium"></p>
        </div>

        <form id="authForm" class="space-y-5" novalidate>
            <div>
                <label id="codeLabel" for="code" class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1.5">Member Code</label>
                <input id="code" name="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
                    placeholder="Enter code"
                    class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg text-lg font-bold tracking-[0.2em] uppercase focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:font-normal placeholder:tracking-normal placeholder:normal-case placeholder-outline/60"/>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 bg-primary text-on-primary font-bold rounded-lg hover:bg-primary-container transition-colors flex items-center justify-center gap-2 mt-2">
                <span id="btnLabel">Enter</span>
                <span id="btnSpinner" class="hidden material-symbols-outlined text-sm animate-spin">progress_activity</span>
            </button>
        </form>
    </div>

    <div class="mt-6 text-center">
        <a href="index.html" class="text-sm text-on-surface-variant hover:text-secondary transition-colors flex items-center justify-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span>Back to site
        </a>
    </div>
</div>

<script type="module">
import { signInWithCode, getIdentity } from './js/auth.js'

const params = new URLSearchParams(location.search)
// Where to go after signing in. A member bounced off an admin page arrives
// here with next=admin.html; sending them back would just bounce them again,
// so admin destinations are only honoured for admins.
const ADMIN_PAGES   = /^admin(-assign|-member)?\.html/
// Only pages on this site: a link like ?next=https://elsewhere must not
// turn the sign-in page into a redirect to another website.
const SITE_PAGE     = /^[\w-]+\.html([?#].*)?$/
const requestedNext = SITE_PAGE.test(params.get('next') ?? '') ? params.get('next') : null
const nextFor = (isAdmin) =>
    requestedNext && (isAdmin || !ADMIN_PAGES.test(requestedNext))
        ? requestedNext
        : (isAdmin ? 'admin.html' : 'points.html')

// Already signed in? Go where they were headed -- unless a member opened
// the Admin tab to step up. A failure here must not stop the form from
// rendering -- this is the page people land on when something else has
// already gone wrong.
let me = null
try { me = await getIdentity() } catch { me = null }
if (me && (me.isAdmin || params.get('mode') !== 'admin')) {
    location.replace(nextFor(me.isAdmin))
}

const els = {
    form      : document.getElementById('authForm'),
    code      : document.getElementById('code'),
    codeLabel : document.getElementById('codeLabel'),
    title     : document.getElementById('cardTitle'),
    blurb     : document.getElementById('cardBlurb'),
    label     : document.getElementById('btnLabel'),
    spinner   : document.getElementById('btnSpinner'),
    btn       : document.getElementById('submitBtn'),
    errBox    : document.getElementById('errorBanner'),
    errMsg    : document.getElementById('errorMsg'),
    tabCode   : document.getElementById('tab-code'),
    tabAdmin  : document.getElementById('tab-admin'),
}

let mode = 'code'

const showError = (msg) => {
    els.errMsg.textContent = msg
    els.errBox.classList.remove('hidden')
}
const clearError = () => els.errBox.classList.add('hidden')

const ACTIVE = ['bg-surface-container-lowest', 'text-primary', 'shadow-sm']

function setMode(which) {
    mode = which
    clearError()
    const admin = mode === 'admin'

    els.codeLabel.textContent = admin ? 'Admin Code' : 'Member Code'
    els.title.textContent = admin ? 'Enter the admin code' : 'Enter the member code'
    els.blurb.textContent = admin
        ? 'Officers and advisers only.'
        : 'Get the code from an officer. No account or email needed.'
    document.title = `${admin ? 'Admin Login' : 'Member Login'} | Bear Link`

    ACTIVE.forEach(c => {
        els.tabAdmin.classList.toggle(c, admin)
        els.tabCode.classList.toggle(c, !admin)
    })
    els.code.focus()
}

els.tabCode.addEventListener('click', () => setMode('code'))
els.tabAdmin.addEventListener('click', () => setMode('admin'))
setMode(params.get('mode') === 'admin' ? 'admin' : 'code')

function busy(on, label) {
    els.btn.disabled = on
    els.spinner.classList.toggle('hidden', !on)
    els.label.textContent = label
}

els.form.addEventListener('submit', async (e) => {
    e.preventDefault()
    clearError()

    const admin = mode === 'admin'
    busy(true, 'Checking…')
    const { error } = await signInWithCode(els.code.value, { admin })
    if (error) {
        showError(error.message)
        busy(false, 'Enter')
        els.code.select()
        return
    }
    location.replace(nextFor(admin))
})
</script>
</body>
</html>
